apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-canary
  namespace: workload
  labels:
    app: inference-service
    track: canary

spec:
  # The rollout controller will scale this up when a rollout begins.
  replicas: 0

  selector:
    matchLabels:
      app: inference-service
      track: canary

  template:
    metadata:
      labels:
        app: inference-service
        track: canary

    spec:
      containers:
        - name: inference-service
          image: inference-service:v0.1.0
          imagePullPolicy: Never

          env:
            - name: TRACK
              value: canary

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 384Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL

      securityContext:
        seccompProfile:
          type: RuntimeDefault