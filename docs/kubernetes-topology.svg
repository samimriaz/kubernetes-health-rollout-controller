<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title description">
  <title id="title">Kubernetes deployment topology</title>
  <desc id="description">The health-rollout cluster showing how Deployments create pods, the Service routes traffic, and supporting rollout, monitoring, and failure-testing workloads run.</desc>
  <defs>
    <marker id="black-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text { font-family: 'Segoe UI', sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 21px; font-weight: 700; }
      .name { font-size: 17px; font-weight: 700; }
      .detail { font-size: 14px; fill: #526274; }
      .cluster { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
      .node { fill: #fff; stroke: #94a3b8; stroke-width: 2; }
      .group { stroke-width: 2; }
      .box { fill: #fff; stroke: #64748b; stroke-width: 1.5; }
      .pod { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.5; }
      .canary { fill: #fff7ed; stroke: #d97706; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="950" fill="#fff"/>
  <text x="40" y="45" class="title">How this project is deployed in Kubernetes</text>
  <text x="40" y="75" class="detail">Arrows explain ownership and traffic routing; boxes show the resources that remain running.</text>

  <rect x="35" y="100" width="1530" height="810" rx="12" class="cluster"/>
  <text x="60" y="135" class="heading">Cluster: health-rollout</text>
  <rect x="65" y="155" width="1470" height="720" rx="10" class="node"/>
  <text x="90" y="190" class="heading">Node: health-rollout-control-plane</text>

  <rect x="95" y="220" width="920" height="370" rx="10" fill="#f0fdf4" stroke="#16a34a" class="group"/>
  <text x="120" y="255" class="heading">workload</text>

  <rect x="125" y="275" width="180" height="65" rx="7" class="box"/>
  <text x="215" y="302" text-anchor="middle" class="name">Load generator</text>
  <text x="215" y="325" text-anchor="middle" class="detail">pod sends requests</text>

  <rect x="360" y="275" width="180" height="65" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="302" text-anchor="middle" class="name">Service</text>
  <text x="450" y="325" text-anchor="middle" class="detail">inference-service</text>

  <path d="M305 307H360" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="332" y="292" text-anchor="middle" class="detail">traffic</text>

  <rect x="620" y="275" width="160" height="65" rx="7" class="pod"/>
  <text x="700" y="302" text-anchor="middle" class="name">Stable pods</text>
  <text x="700" y="325" text-anchor="middle" class="detail">running app</text>
  <rect x="620" y="395" width="160" height="65" rx="7" class="canary"/>
  <text x="700" y="422" text-anchor="middle" class="name">Canary pods</text>
  <text x="700" y="445" text-anchor="middle" class="detail">candidate app</text>

  <path d="M540 307H620" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <path d="M565 307V427H620" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="575" y="375" class="detail">routes to ready pods</text>

  <rect x="825" y="275" width="160" height="65" rx="7" class="box"/>
  <text x="905" y="302" text-anchor="middle" class="name">Stable Deployment</text>
  <text x="905" y="325" text-anchor="middle" class="detail">desired replicas</text>
  <rect x="825" y="395" width="160" height="65" rx="7" class="box"/>
  <text x="905" y="422" text-anchor="middle" class="name">Canary Deployment</text>
  <text x="905" y="445" text-anchor="middle" class="detail">desired replicas</text>

  <path d="M825 307H780" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#black-arrow)"/>
  <path d="M825 427H780" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#black-arrow)"/>
  <text x="802" y="292" text-anchor="middle" class="detail">creates</text>
  <text x="802" y="412" text-anchor="middle" class="detail">creates</text>

  <rect x="125" y="550" width="855" height="25" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="552" y="568" text-anchor="middle" class="detail"><tspan font-weight="700">Rollout settings: HealthGatedRollout</tspan> · stored configuration, not a running pod</text>

  <rect x="1045" y="220" width="450" height="170" rx="10" fill="#fff7ed" stroke="#ea580c" class="group"/>
  <text x="1070" y="255" class="heading">rollout-system</text>
  <rect x="1090" y="285" width="360" height="75" rx="7" class="box"/>
  <text x="1270" y="315" text-anchor="middle" class="name">Rollout manager Deployment</text>
  <text x="1270" y="339" text-anchor="middle" class="detail">creates one manager pod</text>

  <rect x="95" y="620" width="920" height="220" rx="10" fill="#f5f3ff" stroke="#7c3aed" class="group"/>
  <text x="120" y="655" class="heading">monitoring</text>
  <rect x="125" y="690" width="250" height="95" rx="7" class="box"/>
  <text x="250" y="720" text-anchor="middle" class="name">Prometheus StatefulSet</text>
  <text x="250" y="744" text-anchor="middle" class="detail">creates Prometheus pod</text>
  <text x="250" y="766" text-anchor="middle" class="detail">stores health metrics</text>
  <rect x="430" y="690" width="250" height="95" rx="7" class="box"/>
  <text x="555" y="720" text-anchor="middle" class="name">Grafana Deployment</text>
  <text x="555" y="744" text-anchor="middle" class="detail">creates Grafana pod</text>
  <text x="555" y="766" text-anchor="middle" class="detail">shows dashboards</text>
  <rect x="735" y="690" width="250" height="95" rx="7" class="box"/>
  <text x="860" y="720" text-anchor="middle" class="name">GPU exporter Deployment</text>
  <text x="860" y="744" text-anchor="middle" class="detail">creates exporter pod</text>
  <text x="860" y="766" text-anchor="middle" class="detail">publishes test metrics</text>

  <rect x="1045" y="420" width="450" height="260" rx="10" fill="#fff5f5" stroke="#dc2626" class="group"/>
  <text x="1070" y="455" class="heading">chaos-testing</text>
  <rect x="1090" y="485" width="360" height="70" rx="7" class="box"/>
  <text x="1270" y="513" text-anchor="middle" class="name">Chaos controller Deployment</text>
  <text x="1270" y="537" text-anchor="middle" class="detail">creates controller pod</text>
  <rect x="1090" y="580" width="360" height="70" rx="7" class="box"/>
  <text x="1270" y="608" text-anchor="middle" class="name">Chaos DaemonSet</text>
  <text x="1270" y="632" text-anchor="middle" class="detail">creates one daemon pod on this node</text>

  <text x="1080" y="735" class="name">How to read this diagram</text>
  <text x="1080" y="765" class="detail">Deployment / StatefulSet / DaemonSet → creates pods</text>
  <text x="1080" y="792" class="detail">Service → sends traffic to matching ready pods</text>
  <text x="1080" y="819" class="detail">Custom resource → stores settings only</text>
</svg>
