<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title description">
  <title id="title">Kubernetes deployment topology</title>
  <desc id="description">The health-rollout kind cluster, its single control-plane node, four namespaces, workload controllers, services, and pods.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #526274; }
      .cluster-title { font-size: 22px; font-weight: 700; }
      .namespace-title { font-size: 19px; font-weight: 700; }
      .resource-title { font-size: 16px; font-weight: 700; }
      .detail { font-size: 14px; fill: #526274; }
      .cluster { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
      .node { fill: #fff; stroke: #64748b; stroke-width: 2; }
      .namespace { stroke-width: 2; }
      .resource { fill: #fff; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#fff"/>
  <text x="45" y="45" class="title">Kubernetes deployment topology</text>
  <text x="45" y="75" class="subtitle">Runtime resources deployed by this project</text>

  <rect x="35" y="100" width="1530" height="900" rx="12" class="cluster"/>
  <text x="60" y="135" class="cluster-title">kind cluster: health-rollout</text>

  <rect x="65" y="160" width="1470" height="805" rx="10" class="node"/>
  <text x="90" y="195" class="cluster-title">Node: health-rollout-control-plane</text>
  <text x="90" y="220" class="detail">Single node: all project pods are scheduled here</text>

  <rect x="95" y="250" width="680" height="315" rx="10" fill="#f0fdf4" stroke="#16a34a" class="namespace"/>
  <text x="120" y="283" class="namespace-title">Namespace: workload</text>
  <rect x="120" y="310" width="195" height="90" rx="7" stroke="#2563eb" class="resource"/>
  <text x="217" y="340" text-anchor="middle" class="resource-title">Service</text>
  <text x="217" y="364" text-anchor="middle" class="detail">inference-service</text>
  <text x="217" y="386" text-anchor="middle" class="detail">routes to ready pods</text>
  <rect x="350" y="310" width="190" height="105" rx="7" stroke="#16a34a" class="resource"/>
  <text x="445" y="338" text-anchor="middle" class="resource-title">Deployment</text>
  <text x="445" y="362" text-anchor="middle" class="detail">inference-stable</text>
  <text x="445" y="386" text-anchor="middle" class="detail">ReplicaSet → pod(s)</text>
  <rect x="560" y="310" width="190" height="105" rx="7" stroke="#d97706" class="resource"/>
  <text x="655" y="338" text-anchor="middle" class="resource-title">Deployment</text>
  <text x="655" y="362" text-anchor="middle" class="detail">inference-canary</text>
  <text x="655" y="386" text-anchor="middle" class="detail">ReplicaSet → pod(s)</text>
  <rect x="350" y="440" width="190" height="90" rx="7" stroke="#2563eb" class="resource"/>
  <text x="445" y="470" text-anchor="middle" class="resource-title">Deployment</text>
  <text x="445" y="494" text-anchor="middle" class="detail">load-generator</text>
  <text x="445" y="516" text-anchor="middle" class="detail">ReplicaSet → pod</text>
  <rect x="560" y="440" width="190" height="90" rx="7" stroke="#c2410c" class="resource"/>
  <text x="655" y="470" text-anchor="middle" class="resource-title">Rollout settings</text>
  <text x="655" y="494" text-anchor="middle" class="detail">HealthGatedRollout</text>
  <text x="655" y="516" text-anchor="middle" class="detail">custom resource (data)</text>

  <rect x="805" y="250" width="700" height="315" rx="10" fill="#f5f3ff" stroke="#7c3aed" class="namespace"/>
  <text x="830" y="283" class="namespace-title">Namespace: monitoring</text>
  <rect x="830" y="310" width="200" height="105" rx="7" stroke="#7c3aed" class="resource"/>
  <text x="930" y="338" text-anchor="middle" class="resource-title">StatefulSet</text>
  <text x="930" y="362" text-anchor="middle" class="detail">Prometheus</text>
  <text x="930" y="386" text-anchor="middle" class="detail">pod + Service</text>
  <rect x="1055" y="310" width="200" height="105" rx="7" stroke="#7c3aed" class="resource"/>
  <text x="1155" y="338" text-anchor="middle" class="resource-title">Deployment</text>
  <text x="1155" y="362" text-anchor="middle" class="detail">monitoring-grafana</text>
  <text x="1155" y="386" text-anchor="middle" class="detail">pod + Service</text>
  <rect x="1280" y="310" width="200" height="105" rx="7" stroke="#7c3aed" class="resource"/>
  <text x="1380" y="338" text-anchor="middle" class="resource-title">Deployment</text>
  <text x="1380" y="362" text-anchor="middle" class="detail">GPU exporter</text>
  <text x="1380" y="386" text-anchor="middle" class="detail">pod + Service</text>
  <rect x="830" y="440" width="200" height="90" rx="7" stroke="#7c3aed" class="resource"/>
  <text x="930" y="470" text-anchor="middle" class="resource-title">Deployment</text>
  <text x="930" y="494" text-anchor="middle" class="detail">Prometheus operator</text>
  <text x="930" y="516" text-anchor="middle" class="detail">pod</text>
  <rect x="1055" y="440" width="200" height="90" rx="7" stroke="#7c3aed" class="resource"/>
  <text x="1155" y="470" text-anchor="middle" class="resource-title">Deployment</text>
  <text x="1155" y="494" text-anchor="middle" class="detail">kube-state-metrics</text>
  <text x="1155" y="516" text-anchor="middle" class="detail">pod + Service</text>
  <rect x="1280" y="440" width="200" height="90" rx="7" stroke="#7c3aed" class="resource"/>
  <text x="1380" y="470" text-anchor="middle" class="resource-title">DaemonSet</text>
  <text x="1380" y="494" text-anchor="middle" class="detail">node-exporter</text>
  <text x="1380" y="516" text-anchor="middle" class="detail">one pod on this node</text>

  <rect x="95" y="595" width="680" height="315" rx="10" fill="#fff7ed" stroke="#ea580c" class="namespace"/>
  <text x="120" y="628" class="namespace-title">Namespace: rollout-system</text>
  <rect x="145" y="675" width="260" height="110" rx="7" stroke="#c2410c" class="resource"/>
  <text x="275" y="707" text-anchor="middle" class="resource-title">Deployment</text>
  <text x="275" y="733" text-anchor="middle" class="detail">rollout-controller-manager</text>
  <text x="275" y="757" text-anchor="middle" class="detail">ReplicaSet → manager pod</text>
  <rect x="465" y="675" width="260" height="110" rx="7" stroke="#c2410c" class="resource"/>
  <text x="595" y="707" text-anchor="middle" class="resource-title">Service</text>
  <text x="595" y="733" text-anchor="middle" class="detail">controller-manager metrics</text>
  <text x="595" y="757" text-anchor="middle" class="detail">exposes controller metrics</text>

  <rect x="805" y="595" width="700" height="315" rx="10" fill="#fff5f5" stroke="#dc2626" class="namespace"/>
  <text x="830" y="628" class="namespace-title">Namespace: chaos-testing</text>
  <rect x="830" y="675" width="200" height="110" rx="7" stroke="#dc2626" class="resource"/>
  <text x="930" y="707" text-anchor="middle" class="resource-title">Deployment</text>
  <text x="930" y="733" text-anchor="middle" class="detail">chaos-controller-manager</text>
  <text x="930" y="757" text-anchor="middle" class="detail">ReplicaSet → pod</text>
  <rect x="1055" y="675" width="200" height="110" rx="7" stroke="#dc2626" class="resource"/>
  <text x="1155" y="707" text-anchor="middle" class="resource-title">DaemonSet</text>
  <text x="1155" y="733" text-anchor="middle" class="detail">chaos-daemon</text>
  <text x="1155" y="757" text-anchor="middle" class="detail">one pod on this node</text>
  <rect x="1280" y="675" width="200" height="110" rx="7" stroke="#dc2626" class="resource"/>
  <text x="1380" y="707" text-anchor="middle" class="resource-title">Deployment</text>
  <text x="1380" y="733" text-anchor="middle" class="detail">chaos-dns-server</text>
  <text x="1380" y="757" text-anchor="middle" class="detail">ReplicaSet → pod</text>
  <text x="830" y="840" class="detail">Services expose the controller manager, daemon, and DNS server inside the cluster.</text>

  <text x="95" y="945" class="detail">Deployment → ReplicaSet → pod(s). StatefulSet and DaemonSet create their pods directly through their controllers.</text>
</svg>
