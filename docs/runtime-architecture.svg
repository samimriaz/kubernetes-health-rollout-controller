<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Runtime architecture of the Kubernetes health rollout controller</title>
  <desc id="description">A single kind cluster containing application, rollout, monitoring, and failure-testing components.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <style>
      text { font-family: 'Segoe UI', sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526274; }
      .namespace { font-size: 21px; font-weight: 700; }
      .node-title { font-size: 18px; font-weight: 700; }
      .detail { font-size: 15px; fill: #526274; }
      .label { font-size: 15px; font-weight: 700; }
      .box { fill: #fff; stroke-width: 2; rx: 8; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <text x="50" y="48" class="title">How the system works</text>
  <text x="50" y="78" class="subtitle">Request traffic, rollout decisions, health signals, and failure testing</text>

  <rect class="box" x="60" y="225" width="250" height="110" stroke="#c2410c"/>
  <text x="185" y="263" text-anchor="middle" class="node-title">Rollout manager</text>
  <text x="185" y="291" text-anchor="middle" class="detail">evaluates release health</text>
  <text x="185" y="317" text-anchor="middle" class="detail">requests rollout or rollback</text>

  <rect class="box" x="390" y="225" width="220" height="110" stroke="#c2410c"/>
  <text x="500" y="263" text-anchor="middle" class="node-title">Kubernetes API</text>
  <text x="500" y="291" text-anchor="middle" class="detail">applies deployment</text>
  <text x="500" y="317" text-anchor="middle" class="detail">and scaling changes</text>

  <rect class="box" x="710" y="225" width="270" height="110" stroke="#2563eb"/>
  <text x="845" y="263" text-anchor="middle" class="node-title">Inference API</text>
  <text x="845" y="291" text-anchor="middle" class="detail">Service endpoint</text>
  <text x="845" y="317" text-anchor="middle" class="detail">and active application pods</text>

  <rect class="box" x="710" y="105" width="270" height="70" stroke="#2563eb"/>
  <text x="845" y="133" text-anchor="middle" class="node-title">Local client</text>
  <text x="845" y="157" text-anchor="middle" class="detail">POST /predict via port-forward</text>

  <rect class="box" x="1080" y="225" width="230" height="110" stroke="#dc2626" stroke-dasharray="7 5"/>
  <text x="1195" y="263" text-anchor="middle" class="node-title">Chaos Mesh</text>
  <text x="1195" y="291" text-anchor="middle" class="detail">injects controlled faults</text>
  <text x="1195" y="317" text-anchor="middle" class="detail">into the test workload</text>

  <path d="M310 280H390" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#orange-arrow)"/>
  <path d="M610 280H710" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#orange-arrow)"/>
  <path d="M845 175V225" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <path d="M1080 280H980" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#red-arrow)"/>

  <rect x="390" y="455" width="920" height="285" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="420" y="492" class="namespace">Monitoring</text>
  <rect class="box" x="440" y="555" width="230" height="90" stroke="#7c3aed"/>
  <text x="555" y="593" text-anchor="middle" class="node-title">Prometheus</text>
  <text x="555" y="619" text-anchor="middle" class="detail">stores and evaluates metrics</text>
  <rect class="box" x="755" y="555" width="220" height="90" stroke="#7c3aed"/>
  <text x="865" y="593" text-anchor="middle" class="node-title">Grafana</text>
  <text x="865" y="619" text-anchor="middle" class="detail">displays rollout health</text>
  <rect class="box" x="1045" y="555" width="230" height="90" stroke="#7c3aed"/>
  <text x="1160" y="593" text-anchor="middle" class="node-title">GPU exporter</text>
  <text x="1160" y="619" text-anchor="middle" class="detail">publishes test signals</text>

  <path d="M845 335V430H620V555" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#green-arrow)"/>
  <path d="M1160 645V690H555V645" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#green-arrow)"/>
  <path d="M670 600H755" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#green-arrow)"/>
  <path d="M440 600H350V390H185V335" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#green-arrow)"/>

  <line x1="90" y1="850" x2="140" y2="850" stroke="#2563eb" stroke-width="4"/><text x="155" y="856" class="detail">request traffic</text>
  <line x1="355" y1="850" x2="405" y2="850" stroke="#c2410c" stroke-width="4"/><text x="420" y="856" class="detail">controller actions</text>
  <line x1="670" y1="850" x2="720" y2="850" stroke="#15803d" stroke-width="4"/><text x="735" y="856" class="detail">metrics and health results</text>
  <line x1="1070" y1="850" x2="1120" y2="850" stroke="#dc2626" stroke-width="4" stroke-dasharray="9 7"/><text x="1135" y="856" class="detail">failure injection</text>
</svg>
